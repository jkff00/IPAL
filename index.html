<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>基于几何先验的3D gaussian splatting模型优化</title>
  <link rel="stylesheet" href="static/css/bulma.min.css">
  <link rel="stylesheet" href="static/css/index.css">
</head>
<body>

  <!-- 标题 -->
  <section class="hero">
    <div class="hero-body">
      <div class="container is-max-desktop">
        <div class="columns is-centered">
          <div class="column has-text-centered">
            <h1 class="title is-1">室内场景3D gaussian splatting的优化</h1>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- 简介 -->
  <section class="section hero is-light">
    <div class="container is-max-desktop">
      <div class="columns is-centered">
        <div class="column is-four-fifths">
          <h2 class="title is-3">简介</h2>
          <div class="content has-text-justified">
            <p>
              在这里介绍：
              - 项目背景:移动测量设备携带的RGB影像和激光雷达数据,通过多传感器SLAM技术进行点云模特的场景重建,3D GS模型利用可微渲染技术将其渲染为逼真图像。
              - 主要功能:将移动测量设备数据接入3D GS的训练管道并提供先验约束帮助点云到图像模态的转换。
              - 技术特点:1. 利用多尺度图像损失在保持低显存的情况下融入高分辨率纹理;2. 结合激光雷达的几何先验降低对密集图像的需求,提高模型在场景级别的渲染可行性和视角一致性; 3. 利用多传感器融合SLAM技术,提高大规模数据采集的成功率。
            </p>
          </div>
        </div>
      </div>
    </div>
  </section>
